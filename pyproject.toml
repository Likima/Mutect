[project]
name = "mutect"
version = "0.1.0"
description = "Pipeline for predicting and visualizing Short Tandem Repeats (STRs) in long-read genomic sequences"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "biopython>=1.86",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.10.7",
    "numpy>=1.26.0",
    "pandas>=2.3.3",
    "pysam>=0.23.3",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.0",
    "flask>=3.0.0",
    "flask-cors>=5.0.0",
    "joblib>=1.3.0",
    "xgboost>=2.0.0",
    "optuna>=3.5.0",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0.0"]
